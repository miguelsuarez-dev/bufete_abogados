<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<div class="dashboard">
    <div class="sidebar">
        <h3>⚖ Sistema Jurídico</h3>
        <button onclick="window.location.href='dashboard-admin.html'">Inicio</button>
        <button onclick="window.location.href='clientes.html'">Clientes</button>
        <button onclick="window.location.href='abogados.html'">Abogados</button>
        <button onclick="window.location.href='casos.html'">Casos</button>
        <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
    <div class="main">
        <h1 id="bienvenida">Bienvenido, Admin</h1>
        <p>Panel Administrativo completo.</p>
        <div style="display:flex; gap:20px; margin-top:20px; flex-wrap:wrap;">
            <div class="box" style="flex:1; min-width:200px; cursor:pointer;" onclick="window.location.href='clientes.html'">
                <h2>👥 Clientes</h2><p>Gestionar clientes del bufete</p>
            </div>
            <div class="box" style="flex:1; min-width:200px; cursor:pointer;" onclick="window.location.href='abogados.html'">
                <h2>⚖ Abogados</h2><p>Gestionar abogados y especialidades</p>
            </div>
            <div class="box" style="flex:1; min-width:200px; cursor:pointer;" onclick="window.location.href='casos.html'">
                <h2>📁 Casos</h2><p>Gestionar casos y expedientes</p>
            </div>
        </div>
    </div>
</div>
<script src="../js/script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const nombre = verificarAcceso("admin");
    document.getElementById("bienvenida").innerText = `Bienvenido, ${nombre}`;
});
</script>
</body>
</html>
